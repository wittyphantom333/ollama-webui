{% extends "base.html" %}
{% block title %}Profile — Vivus{% endblock %}
{% block content %}
<h2><i class="fas fa-user-circle me-2"></i>Profile</h2>

<div class="card mb-4">
    <div class="card-header fw-semibold">
        <i class="fas fa-id-card me-2"></i>Profile
    </div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="update_profile">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                <div class="form-text text-muted">Usernames can't be changed. Contact an admin if you need this updated.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" value="{{ current_user.email }}" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>Save
            </button>
        </form>
    </div>
</div>

<div class="card mb-4">
    <div class="card-header fw-semibold">
        <i class="fas fa-lock me-2"></i>Change Password
    </div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="change_password">
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" name="current_password" autocomplete="current-password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" name="new_password" autocomplete="new-password" minlength="8" required>
                <div class="form-text text-muted">At least 8 characters.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" name="confirm_password" autocomplete="new-password" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-key me-1"></i>Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
